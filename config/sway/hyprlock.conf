## Neo Brutalism hyprlock — same look as the SDDM login screen.
## Thick black borders, hard offset shadows (a black shape under each block,
## offset down-right), flat colors. Positions are from the screen center, y goes up.
## zindex : backgrounds -2/-1, shadows 1, blocks 2, things on blocks 3, text and input 4.

# Colors ($bg, $main, $ink… and $<name>_hex for markup) : generated by theme/neobrutal.sh
source = ~/.config/sway/hyprlock-colors.conf
# Background : the dot grid, rendered per output by scripts/current_lock
source = ~/.cache/neobrutal-lock/hyprlock-bg.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

#-- Clock ------------------------------------------------------
shape {
    monitor =
    zindex = 1
    size = 400, 150
    color = $shadow
    rounding = 0
    position = 10, 290
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 2
    size = 400, 150
    color = $main
    rounding = 0
    border_size = 4
    border_color = $border
    position = 0, 300
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 4
    text = cmd[update:1000] echo "<b>$(date +%H:%M)</b>"
    color = $ink
    font_size = 84
    font_family = $font
    position = 0, 300
    halign = center
    valign = center
}

#-- Date tag (tilted) ------------------------------------------
shape {
    monitor =
    zindex = 3
    size = 250, 34
    color = $pink
    rounding = 0
    border_size = 3
    border_color = $border
    rotate = 5
    position = 165, 380
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 4
    text = cmd[update:60000] echo "<b>$(LC_ALL=C date '+%A, %B %-d' | tr '[:lower:]' '[:upper:]')</b>"
    color = $ink
    font_size = 12
    font_family = $font
    rotate = 5
    position = 165, 380
    halign = center
    valign = center
}

#-- Card -------------------------------------------------------
shape {
    monitor =
    zindex = 1
    size = 460, 300
    color = $shadow
    rounding = 0
    position = 10, -60
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 2
    size = 460, 300
    color = $surface
    rounding = 0
    border_size = 4
    border_color = $border
    position = 0, -50
    halign = center
    valign = center
}

# title bar : LOCKED + three squares, like the SDDM card
shape {
    monitor =
    zindex = 3
    size = 460, 56
    color = $main
    rounding = 0
    border_size = 4
    border_color = $border
    position = 0, 72
    halign = center
    valign = center
}
label {
    monitor =
    zindex = 4
    text = <b>󰌾  LOCKED</b>
    color = $ink
    font_size = 15
    font_family = $font
    position = -160, 72
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 16, 16
    color = $red
    rounding = 0
    border_size = 2
    border_color = $border
    position = 158, 72
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 16, 16
    color = $yellow
    rounding = 0
    border_size = 2
    border_color = $border
    position = 182, 72
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = 4
    size = 16, 16
    color = $green
    rounding = 0
    border_size = 2
    border_color = $border
    position = 206, 72
    halign = center
    valign = center
}

# user
label {
    monitor =
    zindex = 4
    text = cmd[update:0] echo "<b>HELLO, $(id -un | tr '[:lower:]' '[:upper:]')</b>"
    color = $fg
    font_size = 17
    font_family = $font
    position = 0, 5
    halign = center
    valign = center
}

# password : black shadow + field
shape {
    monitor =
    zindex = 3
    size = 400, 56
    color = $shadow
    rounding = 0
    position = 5, -75
    halign = center
    valign = center
}
input-field {
    monitor =
    zindex = 4
    size = 400, 56
    rounding = 0
    outline_thickness = 3
    outer_color = $border
    inner_color = $bg
    font_color = $fg
    font_family = $font
    check_color = $blue
    fail_color = $red
    capslock_color = $orange
    dots_size = 0.25
    dots_spacing = 0.3
    dots_rounding = 0
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="$muted_hex">password</span>
    fail_text = <b>WRONG PASSWORD ($ATTEMPTS)</b>
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    zindex = 4
    text = ↵  unlock   ·   esc  clear
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}

#-- Now playing (hidden when nothing plays) ----------------------
label {
    monitor =
    zindex = 4
    text = cmd[update:2000] p="playerctl --player=tidal-hifi,spotify,%any"; t="$($p metadata title 2>/dev/null)"; [ -n "$t" ] && echo "󰝚  $($p metadata artist 2>/dev/null) · $t"
    color = $fg
    font_size = 12
    font_family = $font
    position = 0, 60
    halign = center
    valign = bottom
}
